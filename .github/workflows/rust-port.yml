name: Rust port
on:
  push:
    branches: [main, rust-port]
  pull_request:

jobs:
  # C reference build — the oracle. Generates hashes.txt consumed by rust jobs.
  c_oracle_hashes:
    name: Calculate C scene hashes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build C scene hasher
        run: |
          mkdir -p build
          clang -O2 -ffp-contract=off -o build/hash_scene_c test/hash_scene.c extra/ufbx_math.c -lm
      - name: Fingerprint all test scenes
        run: python3 misc/generate_hashses.py --exe build/hash_scene_c -o build/hashes.txt
      - uses: actions/upload-artifact@v4
        with:
          name: hashes
          path: build/hashes.txt

  fmt:
    name: Check formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: cargo fmt
        working-directory: rust
        run: cargo fmt --check

  bindings:
    name: Check generated bindings
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate and diff against committed
        run: |
          ./rust/regen.sh
          git diff --exit-code rust/ufbx/src/generated.rs rust/ufbx/tests/layout.rs

  rust_unit:
    name: Run Rust tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests + struct layout checks
        working-directory: rust
        run: cargo test
      # Same tests with ufbx_real = f32 (layout checks cfg out; the C float
      # oracle is the runner_float leg in the C-tests job).
      - name: Unit tests, real-is-f32
        working-directory: rust
        run: cargo test --features real-is-f32
      - name: Build C-compatible static library
        working-directory: rust
        run: cargo build --features c-abi --release

  # Differential fuzz: native/math.rs vs extra/ufbx_math.c must match
  # bit-for-bit (deterministic edge cases + random sweeps, ~10s runtime).
  math_fuzz:
    name: Fuzz Rust math against C
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fuzz math functions against C
        run: rust/tools/mathfuzz/ci.sh

  # Miri over whole small-file loads (memory-based; load_file needs libc).
  # Aliasing model disabled: guards OOB/UAF/uninit/alignment/leaks, which pass
  # today. The stricter Stacked Borrows run has 4 known aliasing-model
  # findings tracked for Phase 4 — promote once they are fixed.
  miri:
    name: Miri memory checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly + miri
        run: |
          rustup toolchain install nightly --profile minimal
          rustup +nightly component add miri
      - name: Run loads under Miri
        working-directory: rust
        run: MIRIFLAGS="-Zmiri-disable-isolation -Zmiri-disable-stacked-borrows" cargo +nightly miri test --test miri

  # Public API must equal published ufbx-rust 0.11.2 modulo the divergences
  # documented in COMPAT.md (expectations file: rust/tools/api/).
  public_api:
    name: Check public API against ufbx-rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Tool version pinned; the nightly floats — the check script normalizes
      # away rustdoc-version rendering differences (blanket impls, re-export
      # path canonicalization).
      - name: Install nightly + cargo-public-api
        run: |
          rustup toolchain install nightly --profile minimal
          cargo install cargo-public-api --version 0.52.0 --locked
      - name: Diff public API vs crates.io ufbx 0.11.2
        run: rust/tools/check_public_api.sh

  # Drop-in proof: ufbx-rust's own test suite (pinned v0.11.2 tag, unmodified)
  # runs with this crate substituted as the `ufbx` dependency.
  ufbx_rust_tests:
    name: Run ufbx-rust tests against port
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run pinned ufbx-rust suite
        run: rust/tools/run_ufbx_rust_tests.sh

  # Golden-hash parity: hash_scene linked against the Rust staticlib
  # (-DEXTERNAL_UFBX) must reproduce the C oracle's hashes byte-exactly.
  rust_hashes:
    name: Verify Rust scene hashes
    needs: c_oracle_hashes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hashes
          path: build
      - name: Build Rust library
        working-directory: rust
        run: cargo build --features c-abi,dev --release
      - name: Build scene hasher against Rust
        run: |
          clang -O2 -std=gnu99 -DUFBX_DEV -ffp-contract=off -DEXTERNAL_UFBX \
            -o build/hash_scene_rust test/hash_scene.c extra/ufbx_math.c \
            rust/target/release/libufbx.a -lpthread -lm
      - name: Compare fingerprints with C
        run: ./build/hash_scene_rust --check build/hashes.txt

  # Load-time comparison via the hash_scene harness (identical work both
  # sides, so the ratio isolates implementation speed; same-runner
  # measurement cancels machine variance). Report-only — promote to a
  # --max-ratio gate when Phase 4 unsafe-reduction refactors begin.
  bench:
    name: Benchmark Rust against C
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Matched optimization: clang -O3 single TU vs cargo release (opt-level
      # 3, codegen-units=1 via [profile.release]). No UFBX_DEV on either side:
      # dev asserts must not skew the comparison.
      - name: Build Rust library
        working-directory: rust
        run: cargo build --features c-abi --release
      - name: Build both scene hashers
        run: |
          mkdir -p build
          clang -O3 -ffp-contract=off -o build/hash_scene_c test/hash_scene.c extra/ufbx_math.c -lm
          clang -O3 -std=gnu99 -ffp-contract=off -DEXTERNAL_UFBX \
            -o build/hash_scene_rust test/hash_scene.c extra/ufbx_math.c \
            rust/target/release/libufbx.a -lpthread -lm
      - name: Measure load times
        run: python3 rust/tools/bench.py -n 15

  # C test suite (unmodified test/runner.c) linked against the Rust staticlib.
  # The staticlib must carry the `dev` feature: the runner is compiled with
  # -DUFBX_DEV and asserts dev-only behavior (e.g. error stack depth).
  # Supported matrix is x86_64 debug/release/sanitize/float; the full
  # run_tests.py matrix additionally has -m32 legs (needs an i686 Rust
  # build) — add those when they exist.
  c_suite_vs_rust:
    name: Run C tests against Rust port
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build Rust library
        working-directory: rust
        run: cargo build --features c-abi,dev --release
      - name: Run suite, debug build
        run: |
          clang -g -std=gnu99 -DUFBX_DEV -o /tmp/runner_debug test/runner.c rust/target/release/libufbx.a -lpthread -lm
          /tmp/runner_debug -d data
      - name: Run suite, optimized build
        run: |
          clang -O2 -std=gnu99 -DUFBX_DEV -ffp-contract=off -o /tmp/runner_release test/runner.c rust/target/release/libufbx.a -lpthread -lm
          /tmp/runner_release -d data
      - name: Run suite, sanitizers
        run: |
          clang -g -std=gnu99 -DUFBX_DEV -DUFBX_UBSAN -fsanitize=address,undefined -fno-sanitize=float-cast-overflow -fno-sanitize-recover=undefined \
            -o /tmp/runner_san test/runner.c rust/target/release/libufbx.a -lpthread -lm
          /tmp/runner_san -d data
      - name: Build Rust library, real-is-f32
        working-directory: rust
        run: CARGO_TARGET_DIR=target-f32 cargo build --features c-abi,dev,real-is-f32 --release
      - name: Run suite, ufbx_real = float
        run: |
          clang -g -std=gnu99 -DUFBX_DEV -DUFBX_REAL_IS_FLOAT -o /tmp/runner_float test/runner.c rust/target-f32/release/libufbx.a -lpthread -lm
          /tmp/runner_float -d data
